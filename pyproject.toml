[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "replio"
version = "0.19.0"
description = "A lightweight agentic tooling core with API, CLI and REPL interfaces"
requires-python = ">=3.10"
authors = [{name = "Evgenij Myasnikov"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "ai-agents", "api", "assistant", "cli", "cloud", "local", "python", "repl"]

[project.scripts]
replio = "replio.main:main"

[project.urls]
Repository = "https://github.com/emyasnikov/replio"
Issues = "https://github.com/emyasnikov/replio/issues"
Changelog = "https://github.com/emyasnikov/replio/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src", "replio.plugins.bundled" = "plugins"}
packages = [
  "replio",
  "replio.providers",
  "replio.sessions",
  "replio.commands",
  "replio.tools",
  "replio.plugins",
  "replio.plugins.bundled",
  "replio.utils",
]

[tool.setuptools.package-data]
"replio.plugins.bundled" = ["*/*.py", "*/*.json"]
