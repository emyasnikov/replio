[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "replai"
version = "0.1.0"
description = "A terminal-based REPL AI chat application supporting multiple LLM providers"
requires-python = ">=3.10"
authors = [{name = "REPL.ai contributors"}]

[project.scripts]
replai = "replai.main:main"

[tool.setuptools.packages.find]
where = ["src"]
