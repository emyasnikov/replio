<svg xmlns="http://www.w3.org/2000/svg" width="560" height="168" viewBox="0 0 560 168" role="img" aria-label="A REPL.io terminal session">
  <defs>
    <style>
      .bar { fill: #282A36; }
      .title { fill: #6e7681; font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 12px; }
      .dim  { fill: #8b949e; font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 13.5px; }
      .user { fill: #e6edf3; font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 13.5px; }
      .prompt { fill: #22d3ee; font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 13.5px; }
      .answer { fill: #e3b341; font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 13.5px; }
    </style>
  </defs>

  <rect width="560" height="168" rx="8" fill="#282A36"/>
  <rect class="bar" width="560" height="32" rx="8"/>

  <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="6" fill="#febc2e"/>
  <circle cx="60" cy="20" r="6" fill="#28c840"/>
  <text class="title" x="285" y="22" text-anchor="middle">replio</text>

  <text class="dim" x="16" y="60">REPL.io (ollama: gpt-oss:20b-cloud)  /help for commands</text>

  <text x="16" y="90"><tspan class="prompt">&gt;&gt;&gt; </tspan><tspan class="user">Hi</tspan></text>
  <text x="16" y="110"><tspan class="answer">&lt;&lt;&lt; </tspan><tspan class="user">Hello! 👋 How can I help you today?</tspan></text>
  <text class="dim" x="16" y="130">(1.1s, 8 tokens)</text>

  <text x="16" y="150"><tspan class="prompt">&gt;&gt;&gt;</tspan></text>
  <text x="48" y="150"><tspan class="user">&#95;</tspan></text>
</svg>
